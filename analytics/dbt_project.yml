name: analytics

profile: databricks

clean-targets:
  - "targets"
  - "dbt_packages"

models:
  analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts